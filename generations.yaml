    description: "The Land Rover LR3 is the North American and select export market name for the third-generation Land Rover Discovery (Discovery 3), introduced in 2004 and sold in the United States from the 2005 model year through 2009. It represented a complete redesign over the previous Discovery, adopting Land Rover's Integrated Body-Frame construction, which combined a traditional ladder frame with a monocoque body to deliver both off-road strength and improved on-road refinement. The LR3's boxy, upright styling with a stepped roofline and asymmetric rear tailgate maximized interior space and visibility, offering three rows of stadium-style seating for up to seven occupants. Central to the vehicle was Land Rover's Terrain Response system, which allowed the driver to optimize the drivetrain, air suspension, and traction controls for different surfaces such as sand, mud, rock crawl, and snow. In the North American market, the LR3 was powered by a 4.4-litre Jaguar-derived V8 producing around 300 horsepower paired with a six-speed automatic transmission, while other markets also received V6 petrol and diesel options. The height-adjustable air suspension provided variable ground clearance and access modes, and the interior offered a step up in quality and technology over its predecessor, with available leather, navigation, and a panoramic Alpine roof. The LR3 earned praise for its exceptional off-road capability combined with newfound on-road civility, and was replaced by the facelifted LR4 (Discovery 4) for the 2010 model year."
